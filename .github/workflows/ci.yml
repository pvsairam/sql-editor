name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Browser test of the results grid
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test/webview/webview.e2e.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: releases/*.vsix
