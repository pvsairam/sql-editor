<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results webview harness</title>
<style>
  /* approximate VS Code "Dark Modern" variables so the harness looks like the real thing */
  :root {
    --vscode-editor-background:#1f1f1f; --vscode-foreground:#cccccc; --vscode-panel-border:#2b2b2b;
    --vscode-focusBorder:#0078d4; --vscode-descriptionForeground:#9d9d9d; --vscode-font-family:-apple-system,Segoe UI,sans-serif;
    --vscode-editor-font-family:Menlo,Consolas,monospace; --vscode-font-size:13px; --vscode-editor-font-size:12.5px;
    --vscode-button-background:#0078d4; --vscode-button-foreground:#fff; --vscode-button-hoverBackground:#026ec1;
    --vscode-button-secondaryBackground:#313131; --vscode-button-secondaryForeground:#ccc; --vscode-button-secondaryHoverBackground:#3c3c3c;
    --vscode-input-background:#313131; --vscode-input-foreground:#ccc; --vscode-input-border:#3c3c3c;
    --vscode-list-hoverBackground:#2a2d2e; --vscode-editorGroupHeader-tabsBackground:#181818;
    --vscode-tab-activeBackground:#1f1f1f; --vscode-tab-inactiveBackground:#181818; --vscode-tab-activeForeground:#fff; --vscode-tab-inactiveForeground:#9d9d9d;
    --vscode-tab-activeBorderTop:#0078d4; --vscode-errorForeground:#f85149; --vscode-textCodeBlock-background:#2b2b2b;
    --vscode-editorWidget-background:#202020; --vscode-menu-background:#1f1f1f; --vscode-menu-foreground:#ccc; --vscode-menu-selectionBackground:#0078d4;
    --vscode-toolbar-hoverBackground:#383a3b; --vscode-testing-iconPassed:#73c991;
  }
</style>
<link rel="stylesheet" href="/media/results.css">
</head>
<body>
<div id="app"></div>
<script>
  window.__sent = [];
  window.acquireVsCodeApi = () => ({ postMessage: (m) => window.__sent.push(m), getState: () => undefined, setState() {} });
</script>
<script type="module" src="/media/webview/main.js"></script>
</body>
</html>
